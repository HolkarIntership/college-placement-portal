<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Placement Portal</title>
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>

  </head>
  <body class="bg-gray-100 font-sans">
    <!-- Navbar -->
    <nav
      class="bg-gradient-to-r from-blue-800 to-blue-500 text-white shadow-md"
    >
      <div class="container mx-auto flex justify-between items-center p-4">
        <a href="index.html" class="text-2xl font-bold">Placement Portal</a>
        <ul class="hidden md:flex space-x-6 text-lg">
          <li><a href="index.html" class="hover:text-yellow-400">Home</a></li>
          <li>
            <a href="companies.html" class="hover:text-yellow-400">Companies</a>
          </li>
          <li>
            <a href="register.html" class="hover:text-yellow-400">Register</a>
          </li>
          <li>
            <a href="contact.html" class="hover:text-yellow-400">Contact</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Hero -->
    <section
      class="relative bg-blue-500 h-[250px] flex justify-center items-center text-white text-center"
    >
      <h1 class="text-4xl font-bold">Student Registration</h1>
    </section>

    <!-- Registration Form -->
    <section class="container mx-auto py-16 px-4">
      <h2 class="text-3xl font-bold text-center mb-12">Register Here</h2>
      <div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow">
        <form id="registrationForm" class="space-y-4">
          <div>
            <label class="block mb-1 font-semibold">Name</label>
            <input
              type="text"
              id="name"
              class="w-full border border-gray-300 p-2 rounded"
              required
            />
          </div>
          <div>
            <label class="block mb-1 font-semibold">Email</label>
            <input
              type="email"
              id="email"
              class="w-full border border-gray-300 p-2 rounded"
              required
            />
          </div>
          <div>
            <label class="block mb-1 font-semibold">Roll Number</label>
            <input
              type="text"
              id="roll"
              class="w-full border border-gray-300 p-2 rounded"
              required
            />
          </div>
          <div>
            <label class="block mb-1 font-semibold">Department</label>
            <select
              id="department"
              class="w-full border border-gray-300 p-2 rounded"
              required
            >
              <option value="">Select Department</option>
              <option value="CSE">CSE</option>
              <option value="ECE">ECE</option>
              <option value="IT">IT</option>
              <option value="CS">CS</option>
              <option value="BSC">BSC</option>
            </select>
          </div>
          <button
            type="submit"
            class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition w-full"
          >
            Submit
          </button>
        </form>
      </div>
    </section>

    <script>
      document
        .getElementById("registrationForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          alert("Thank you for registering! Your details have been submitted.");
          this.reset();
        });
    </script>

    <!-- Footer -->
    <footer class="bg-blue-900 text-white py-6 text-center">
      &copy; 2025 College Placement Cell | All Rights Reserved
    </footer>
  </body>
</html>
